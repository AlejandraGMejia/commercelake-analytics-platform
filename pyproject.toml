[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commercelake-analytics-platform"
version = "0.1.0"
description = "Cloud retail analytics platform"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pyarrow>=20,<27",
    "PyYAML>=6,<7",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
